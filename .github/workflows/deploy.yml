name: Deploy PoloPad Pro iOS PWA & Run Hardware DRC Suite

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  qa-and-build:
    name: Red-Team Hardware DRC, Rules QA & Vite Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Black October Security Audit, Multi-Agent Code Review & Hardware DRC Suite
        run: |
          python3 scripts/audit_skills_security.py
          python3 scripts/context7_doc_inspector.py
          python3 scripts/run_code_simplifier.py
          python3 scripts/run_code_review.py
          python3 tests/test_rules_engine.py
          python3 tests/test_overdrive_qa_suite.py

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: react_app/package-lock.json

      - name: Install Dependencies & Build PoloPad Pro PWA
        working-directory: react_app
        run: |
          npm ci
          npm run build

      - name: Run Playwright E2E Production Bundle & Download Verification
        run: |
          python3 tests/test_playwright_e2e.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'react_app/dist'

  deploy:
    name: Publish to GitHub Pages (https://peternunley08-ops.github.io/polobridge/)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: qa-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
