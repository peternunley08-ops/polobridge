name: PoloBridge CI — Hardware DRC, Rules QA & Vite Production Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  qa-and-build:
    name: Red-Team Hardware DRC, Rules QA & Vite Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Black October Security Audit, Multi-Agent Code Review & Hardware DRC Suite
        run: |
          python3 scripts/audit_skills_security.py
          python3 scripts/context7_doc_inspector.py
          python3 scripts/run_code_simplifier.py
          python3 scripts/run_code_review.py
          python3 tests/test_rules_engine.py
          python3 tests/test_overdrive_qa_suite.py
          python3 tests/test_phone_version.py
          python3 tests/test_webserial_flasher.py
          python3 tests/test_offline_persistence.py
          python3 tests/test_digital_scoresheet.py
          python3 tests/test_tournament_director.py
          python3 tests/test_agent_definitions.py
          python3 tests/test_six_eight_bridge.py
          python3 tests/test_audio_synthesizer.py

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: react_app/package-lock.json

      - name: Install Dependencies, Run Court Link Engine Tests & Build PoloPad Pro PWA
        working-directory: react_app
        run: |
          npm ci
          npm test
          npm run build

      - name: Run Playwright E2E Production Bundle & Download Verification
        run: |
          python3 tests/test_playwright_e2e.py
